#cloud-config
# VoiceRAG on an Oracle Cloud "Always Free" Ampere A1 instance.
#
# Paste this whole file into the instance-creation form under
#   Show advanced options -> Management -> User data -> Paste cloud-init script
#
# It prepares the machine and stops. It deliberately does NOT build the image:
# the build downloads a 440 MB shard and embeds 197k passages, which takes
# 15-25 minutes, and a cloud-init step that long fails silently into a log file
# nobody reads. You run `deploy.sh` yourself, in tmux, watching it.
#
# Target image: Canonical Ubuntu 24.04 (aarch64). For Oracle Linux, the docker
# install and the firewall section both differ -- see README.md.

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git
  - tmux
  - iptables-persistent

write_files:
  # Oracle's Ubuntu images ship an INPUT chain that drops everything except SSH,
  # and it is separate from the cloud-side Security List. Opening the Security
  # List alone leaves Let's Encrypt unable to reach port 80, and the failure
  # looks like a Caddy bug: the certificate request simply times out. Both
  # layers have to be opened, and this is the one people miss.
  - path: /usr/local/sbin/voicerag-open-ports
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      for port in 80 443; do
        if ! iptables -C INPUT -p tcp --dport "$port" -j ACCEPT 2>/dev/null; then
          iptables -I INPUT 1 -p tcp --dport "$port" -j ACCEPT
        fi
      done
      netfilter-persistent save

runcmd:
  # --- docker ---------------------------------------------------------------
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ubuntu

  # --- firewall (see write_files above for why) ------------------------------
  - /usr/local/sbin/voicerag-open-ports

  # --- swap -----------------------------------------------------------------
  # Insurance, not a requirement. A 4 OCPU / 24 GB Ampere shape has ample room,
  # but a smaller shape can OOM while embedding 197k passages, and an OOM-killed
  # build looks like a hung one.
  - fallocate -l 4G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - sh -c 'echo "/swapfile none swap sw 0 0" >> /etc/fstab'

  # --- source ---------------------------------------------------------------
  - mkdir -p /opt/voicerag
  - chown ubuntu:ubuntu /opt/voicerag
  - sudo -u ubuntu git clone --depth 1 https://github.com/samarthputhraya/voicerag.git /opt/voicerag/repo
  - sudo -u ubuntu cp /opt/voicerag/repo/deploy/oracle/env.template /opt/voicerag/.env
  - chmod 600 /opt/voicerag/.env
  - chown ubuntu:ubuntu /opt/voicerag/.env

  # Pre-pull the base images so the build itself is CPU-bound rather than
  # waiting on the registry.
  - docker pull node:22-slim
  - docker pull python:3.11-slim
  - docker pull caddy:2-alpine

  - sh -c 'echo "cloud-init finished at $(date -u)" > /opt/voicerag/READY'

final_message: |
  VoiceRAG host is prepared. Now:
    ssh ubuntu@<public-ip>
    nano /opt/voicerag/.env        # add SARVAM_API_KEY and GROQ_API_KEY
    tmux new -s deploy
    /opt/voicerag/repo/deploy/oracle/deploy.sh
