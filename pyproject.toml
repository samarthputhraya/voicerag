[project]
name = "voicerag"
version = "1.0.0"
description = "Voice-first retrieval-augmented QA with a 200 ms end-to-end budget."
requires-python = ">=3.10"
readme = "README.md"

# Runtime floor for the serving path. Everything here is imported by
# `voicerag.api.main:app` on a normal request, so anything that is not is in an
# optional group instead -- a deployment should not install a training stack to
# answer a question.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",            # sparse matmul behind the LSA projection
    "faiss-cpu>=1.8",         # HNSW dense index
    "bm25s>=0.2",             # sparse index
    "PyStemmer>=2.2",         # bm25s stemming; pure-python fallback is ~5x slower
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",            # Groq/Gemini/Sarvam HTTP clients
    "websockets>=12.0",       # Sarvam/ElevenLabs realtime STT
    "orjson>=3.9",            # ChunkStore serialisation fast path
]

[project.optional-dependencies]
# Embedding backends that need model weights. The pipeline degrades to the
# corpus-fit LSA embedder without them, so they are not a serving requirement.
embed = [
    "model2vec>=0.3",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]
# Corpus construction from MSMARCO-XI. Only `scripts/ingest.py` needs these.
data = [
    "datasets>=2.19",
    "pyarrow>=15.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Starlette nudges towards httpx2; the TestClient works and the warning is
    # noise on every API test.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "eval", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SLF"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI dependencies are function calls in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF"]  # tests may reach into internals; that is what they are for
